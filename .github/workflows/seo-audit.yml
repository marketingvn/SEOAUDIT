name: An Phuoc SEO Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run SEO audit
        run: python seo_monitor.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-reports
          path: reports/
          if-no-files-found: error
